<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>info Dengue - Projeto de extensão</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&amp;family=Fraunces:wght@600;800&amp;family=Source+Serif+4:wght@400;600&amp;display=swap">
<style>
:root{--bg:#f1f6f3;--ink:#10262a;--card:#fff;--line:#cfdcd7;--acc:#c2185b;--hd:'Bricolage Grotesque',system-ui,sans-serif;--bd:'Source Serif 4',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0d1b1e;--ink:#e6f0ec;--card:#16292d;--line:#2a4247}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg) center/cover fixed;color:var(--ink);font:1.05rem/1.65 var(--bd);min-height:100vh;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap;padding:10px clamp(16px,5vw,64px);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font:800 1.3rem var(--hd);letter-spacing:-.02em;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tab{font:600 .95rem var(--hd);padding:6px 14px;border-radius:99px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;color:var(--ink);border:1px solid transparent;background:none}
.tab:hover{border-color:var(--line)}
.tab.on{background:var(--acc);color:#fff;cursor:default}
.tab button{background:none;border:0;color:inherit;cursor:pointer;padding:0 2px;font-size:1.1rem;line-height:1}
.tab.add{border:1px dashed var(--acc);color:var(--acc)}
.blk{position:relative;padding:var(--pad,56px) clamp(16px,5vw,64px);font-size:calc(1.05rem*var(--fs,100)/100);background-size:cover;background-position:center}
.in{max-width:900px;margin:0 auto}
.text .in,.heading .in{max-width:720px}
.cg,.sp,.embed .in{max-width:1100px}
.fig{width:var(--w,100%);max-width:1100px}
.blk h1,.blk h2,.blk h3{font-family:var(--hd);margin:0 0 .4em;line-height:1.05;letter-spacing:-.02em}
.blk h1{font-size:clamp(2.2em,7vw,4.6em);font-weight:800}
.blk h2{font-size:2em;font-weight:800}
.blk h3{font-size:1.25em;font-weight:700}
.blk p{margin:0 0 1em}
.lead{font-size:1.2em;max-width:40em}
.hero{background-color:#0f3d3e;background-image:radial-gradient(rgba(255,255,255,.14) 1.5px,transparent 1.5px);background-size:22px 22px;color:#fff}
.hero .in{min-height:34vh;display:flex;flex-direction:column;justify-content:center}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:rgba(127,127,127,.12);border:1px solid rgba(127,127,127,.3);border-radius:14px;padding:20px}
.card p{margin:0}
.sp{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.sp.flip>:first-child{order:2}
@media(max-width:700px){.sp{grid-template-columns:1fr;gap:20px}.sp.flip>:first-child{order:0}}
.imgw img{width:100%;display:block;border-radius:12px}
.sp .imgw img,.sp .ph{aspect-ratio:4/3;object-fit:cover}
.ph{aspect-ratio:16/9;display:grid;place-items:center;border-radius:12px;font:600 1rem var(--hd);background:repeating-linear-gradient(45deg,rgba(127,127,127,.2) 0 12px,rgba(127,127,127,.08) 12px 24px)}
figcaption{font-size:.9em;opacity:.75;margin-top:8px}
.empty{text-align:center;padding:80px 20px;opacity:.7}
.frame{position:relative;height:var(--hh,560px);border-radius:12px;overflow:hidden;border:1px solid rgba(127,127,127,.3);background:rgba(127,127,127,.12);display:grid;place-items:center;text-align:center;padding:16px;margin-bottom:8px}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btn{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;font:700 .95rem var(--hd);padding:10px 18px;border-radius:99px}
.map .in{max-width:1180px}
.mw{display:grid;grid-template-columns:300px 1fr;border-radius:16px;overflow:hidden;border:1px solid rgba(127,127,127,.3);margin-top:20px;font-size:.9rem;line-height:1.4;text-align:left}
.ms{background:#0f3d3e;color:#fff;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:780px;overflow:auto;font-family:var(--hd)}
.ms h3{margin:0;font-size:1.25rem;color:#fff}
.ms label{display:flex;flex-direction:column;gap:4px;font-weight:600}
.ms select,.ms input[type=search]{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 9px}
.ms option{color:#000}
.ms fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.ms legend{font-weight:700;margin-bottom:6px;padding:0}
.ms .chip{flex-direction:row;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.ms .chip i{width:10px;height:10px;border-radius:50%;flex:none}
.msum{border-top:1px solid rgba(255,255,255,.25);padding-top:12px}
.dbi{font-size:.8rem;opacity:.85;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
.dbe{display:grid;gap:6px}
.dbe button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px;font:700 .85rem var(--hd);cursor:pointer}
.dbe button:last-of-type{background:none;border:1px solid rgba(255,255,255,.4)}
.dbe small{opacity:.75;line-height:1.3}
.mmap{position:relative}
.mmap.dn svg{cursor:crosshair}
.ms .seg{border-color:rgba(255,255,255,.35)}
.ms .seg button{font-family:var(--hd)}
.ms input[data-df]{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 9px;color-scheme:dark;font:inherit}
.ms .fb{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:9px;font:700 .85rem var(--hd);cursor:pointer;width:100%}
.ms .pri2{background:var(--acc);border-color:var(--acc)}
.dph img{width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-top:8px}
.dloc{font-size:.85rem;opacity:.9}
.ms .lerr{color:#ffb4ab}
.rl{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border-radius:8px;padding:7px 10px}
.rl small{display:block;opacity:.75}
.mlist .rl button{width:auto;margin-left:auto;padding:2px 8px;background:rgba(255,255,255,.15)}
.dsvg g[data-pin]{cursor:pointer}
.tip{position:absolute;z-index:6;width:240px;max-width:90%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 10px 28px rgba(0,0,0,.3);transform:translateX(-50%);display:grid;gap:4px;font:.85rem/1.35 var(--hd);text-align:left;pointer-events:none}
.tip[hidden]{display:none}
.tip img{width:100%;max-height:140px;object-fit:cover;border-radius:8px}
.tip small{opacity:.75}
.sm{position:relative;height:560px;overflow:hidden;border-radius:12px;background:#e6ece8;touch-action:none;cursor:grab;user-select:none;color:#222}
.sm .fb,.sm .tl,.sm .pins{position:absolute;inset:0}
.sm .pins{pointer-events:none}
.sm .pin{position:absolute;pointer-events:auto;cursor:pointer;width:40px;height:54px}
.sm .tl img{position:absolute;width:256px;height:256px;max-width:none}
.uf2{fill:rgba(0,0,0,.06);stroke:#6b7f78;stroke-width:2}
.sm .zc{position:absolute;right:10px;top:10px;z-index:3;display:grid;gap:4px}
.zb{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 18px/1 var(--hd);cursor:pointer}
.sm .at{position:absolute;right:6px;bottom:4px;font-size:11px;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:4px;z-index:3}
.sm .note{display:none;position:absolute;left:10px;top:10px;right:60px;z-index:3;background:var(--card);color:var(--ink);padding:6px 10px;border-radius:8px;font-size:.8rem;line-height:1.3}
.sm.nt .note{display:block}
.mlist{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto}
.mlist button{display:flex;align-items:center;gap:8px;width:100%;background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font:inherit;text-align:left}
.mlist button i{width:10px;height:10px;border-radius:50%;flex:none}
.mlist button span{margin-left:auto;font-weight:700}
.mlist button.on{background:var(--acc)}
.mm{padding:16px;background:rgba(127,127,127,.08);display:flex;flex-direction:column;gap:16px;min-width:0}
.mmap svg{width:100%;height:auto;max-height:560px;display:block}
.uf{fill:rgba(127,127,127,.18);stroke:rgba(127,127,127,.55);stroke-width:2}
.mmap g{cursor:pointer}
.mmap text{fill:currentColor;font:700 15px var(--hd)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85em;align-items:center}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.mdet h3{font-size:1.15rem;margin:0 0 10px}
.mdet h4{font:700 1rem var(--hd);margin:16px 0 4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}
.tile{background:rgba(127,127,127,.14);border-radius:10px;padding:10px}
.tile b{display:block;font:800 1.3rem var(--hd)}
.tile small{opacity:.75}
.spk{width:100%;max-width:420px;height:auto}
.spk text{font:700 12px var(--hd);fill:currentColor}
.spk .ax{opacity:.7;font-weight:500}
@media(max-width:800px){.mw{grid-template-columns:1fr}.ms{max-height:none}}
body.ed .blk{outline:2px dashed transparent;outline-offset:-6px}
body.ed .blk:hover,body.ed .blk.sel{outline-color:var(--acc)}
body.ed .imgw{cursor:pointer;position:relative}
body.ed .imgw:hover::after{content:"Trocar imagem";position:absolute;right:8px;bottom:8px;background:var(--acc);color:#fff;padding:4px 10px;border-radius:8px;font:600 .8rem var(--hd)}
[contenteditable]{cursor:text}
[contenteditable]:focus{outline:none;background:rgba(127,127,127,.14);border-radius:4px}
.tb{display:none;position:absolute;top:8px;right:8px;z-index:5;max-width:calc(100% - 16px);flex-wrap:wrap;gap:4px;align-items:center;padding:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:500 .78rem/1.2 system-ui,sans-serif;box-shadow:0 6px 22px rgba(0,0,0,.25);text-align:left;font-style:normal;letter-spacing:0}
body.ed .blk.sel .tb{display:flex}
.tb button,.tb label{background:none;border:1px solid var(--line);color:inherit;border-radius:6px;padding:4px 7px;cursor:pointer;display:inline-flex;gap:5px;align-items:center;font-size:.78rem}
.tb button:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.tb input[type=color]{width:24px;height:20px;padding:0;border:0;background:none}
.tb input[type=range]{width:72px}
.tb input[type=url]{width:150px;background:var(--bg);color:inherit;border:1px solid var(--line);border-radius:4px;padding:2px 4px;font-size:.78rem}
#dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:20;pointer-events:none}
.dk{pointer-events:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;padding:6px;background:var(--ink);border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.3)}
.dk button{background:none;border:0;color:var(--bg);font:600 .88rem var(--hd);padding:9px 13px;border-radius:10px;cursor:pointer}
.dk button:hover{background:rgba(127,127,127,.35)}
.dk .pri{background:var(--acc);color:#fff}
#menu{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#menu[hidden]{display:none}
#menu button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 14px;font:600 .9rem var(--hd);cursor:pointer;text-align:left}
#menu button:hover{border-color:var(--acc);color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font:600 .85rem var(--hd);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(520px,92vw);padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dl{padding:22px;display:grid;gap:14px;font-family:var(--hd)}
.dl h2{margin:0;font-size:1.4rem}
.dl label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.dl label.col{flex-direction:column;align-items:stretch}
.dl select,.dl textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.dl .row{display:flex;gap:8px;flex-wrap:wrap}
.dl button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600}
.dl .pri{background:var(--acc);border-color:var(--acc);color:#fff}
.dk:empty{display:none}
#dh{position:fixed;z-index:25;width:28px;height:28px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:15px;line-height:1;cursor:grab;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center;padding:0}
#dh[hidden]{display:none}
body.drg,body.drg *{cursor:grabbing!important;user-select:none}
.blk.dragging{outline:2px dashed var(--acc)!important;outline-offset:-6px}
.blk.dragging::after{content:"";position:absolute;inset:0;background:rgba(194,24,91,.07);pointer-events:none}
.gw{position:relative}
.gb{background:none;border:1px solid var(--line);color:var(--ink);width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center;position:relative}
.gb:hover{border-color:var(--acc);color:var(--acc)}
.gb svg{width:22px;height:22px}
.gb.dirty::after{content:"";position:absolute;top:3px;right:3px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.gm{position:absolute;right:0;top:calc(100% + 8px);width:min(300px,calc(100vw - 32px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.28);padding:14px;display:grid;gap:14px;font-family:var(--hd);font-size:.9rem;line-height:1.3;z-index:30}
.gm[hidden]{display:none}
.gm h2{margin:0;font-size:1rem}
.gm .lb{font-weight:700;margin-bottom:6px;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:none;border:0;color:inherit;padding:8px 6px;cursor:pointer;font:600 .85rem var(--hd)}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
.sw{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:inherit;font:600 .95rem var(--hd);padding:4px 0;cursor:pointer}
.sw i{width:42px;height:24px;border-radius:99px;background:rgba(127,127,127,.45);position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true] i{background:var(--acc)}
.sw[aria-checked=true] i::after{transform:translateX(18px)}
.gm .act{display:grid;gap:6px}
.gm .act button{border:1px solid var(--line);background:none;color:inherit;border-radius:10px;padding:9px;cursor:pointer;font:700 .9rem var(--hd)}
.gm .act .pri{background:var(--acc);border-color:var(--acc);color:#fff}
.gs{font-size:.8rem;opacity:.8}
.gs:empty{display:none}
.dev{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.lg{display:grid;gap:8px}
.lg[hidden]{display:none}
.lg label{display:grid;gap:4px;font-weight:600}
.lg input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit}
.lg .pri{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:10px;padding:9px;cursor:pointer;font:700 .9rem var(--hd)}
.lerr{color:#d32f2f;font-size:.8rem}
.lerr:empty{display:none}
.ib{position:absolute;z-index:2;pointer-events:none}
.ib img{width:100%;display:block;border-radius:10px;pointer-events:none;user-select:none;-webkit-user-drag:none}
body.ed .ib{pointer-events:auto;cursor:grab;touch-action:none;outline:2px dashed var(--acc);outline-offset:2px}
body.ed .ib.mv{cursor:grabbing}
.ibx,.ibr{display:none}
body.ed .ibx{display:grid;position:absolute;top:-12px;right:-12px;width:24px;height:24px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:15px;line-height:1;cursor:pointer;place-items:center;padding:0}
body.ed .ibr{display:block;position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:4px;background:var(--acc);border:2px solid #fff;cursor:nwse-resize}
.bhd{display:none}
body.ed .blk.sel .bhd{display:block;position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);width:84px;height:18px;border-radius:99px;background:var(--acc);border:2px solid #fff;cursor:ns-resize;z-index:6;touch-action:none}
.bhd::after{content:"";position:absolute;left:22px;right:22px;top:6px;height:2px;border-radius:2px;background:#fff}
/* abas arrastáveis */
.tg{cursor:grab;opacity:.6;font-size:.8rem;letter-spacing:-2px;touch-action:none;user-select:none;padding:0 2px}
.tab.tdrag{opacity:.45}
.tab.dropb{box-shadow:-4px 0 0 var(--acc)}
.tab.dropa{box-shadow:4px 0 0 var(--acc)}
/* tema mosquito / dengue */
.brand::before{content:"";display:inline-block;width:1.15em;height:1.15em;margin-right:.35em;vertical-align:-.2em;background:var(--acc);-webkit-mask:var(--mq) center/contain no-repeat;mask:var(--mq) center/contain no-repeat}
.blk h2::before{content:"";display:inline-block;width:.75em;height:.75em;margin-right:.35em;vertical-align:-.02em;background:var(--acc);-webkit-mask:var(--mq) center/contain no-repeat;mask:var(--mq) center/contain no-repeat}
.hero{background-image:var(--mqw),radial-gradient(rgba(255,255,255,.14) 1.5px,transparent 1.5px);background-size:240px 240px,22px 22px}
.hero .in{position:relative;z-index:1}
.hero::before{content:"";position:absolute;right:5%;top:50%;width:clamp(120px,24vw,300px);aspect-ratio:1;transform:translateY(-50%) rotate(14deg);background:rgba(255,255,255,.2);-webkit-mask:var(--mq) center/contain no-repeat;mask:var(--mq) center/contain no-repeat;pointer-events:none;animation:mqf 7s ease-in-out infinite}
@keyframes mqf{0%,100%{transform:translateY(-50%) rotate(14deg)}50%{transform:translateY(-56%) rotate(6deg)}}
@media(prefers-reduced-motion:reduce){.hero::before{animation:none}}
.card{border-top:4px solid var(--acc)}
.card h3::before{content:"";display:inline-block;width:.7em;height:.85em;margin-right:.45em;background:var(--acc);-webkit-mask:var(--drop) center/contain no-repeat;mask:var(--drop) center/contain no-repeat}
#mn::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--acc);opacity:.06;-webkit-mask:var(--mqt) 0 0/240px 240px;mask:var(--mqt) 0 0/240px 240px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #mn::before{opacity:.1}}
:root[data-theme="dark"] #mn::before{opacity:.1}
#hd{border-bottom:3px solid var(--acc)}
.ft{display:flex;gap:10px;align-items:center;justify-content:center;padding:28px clamp(16px,5vw,64px);font:600 .95rem var(--hd);text-align:center;opacity:.85}
.ft i{flex:none;width:26px;height:26px;background:var(--acc);-webkit-mask:var(--mq) center/contain no-repeat;mask:var(--mq) center/contain no-repeat}
</style>
</head>
<body>
<header id="hd"></header>
<main id="mn"></main>
<footer class="ft"><i aria-hidden="true"></i><span>Elimine a água parada: cada recipiente virado é um criadouro a menos do Aedes aegypti.</span></footer>
<div id="menu" hidden="">

document.addEventListener('pointerdown',ev=>{if(!editing||!ev.target.closest)return;const g=ev.target.closest('.tg');if(!g)return;const tab=g.closest('[data-pid]');if(!tab)return;ev.preventDefault();tgd={id:tab.dataset.pid,tab,drop:null,snap:JSON.stringify(S)};tab.classList.add('tdrag');g.setPointerCapture(ev.pointerId)});
document.addEventListener('pointermove',ev=>{if(!tgd)return;document.querySelectorAll('.tab.dropb,.tab.dropa').forEach(x=>x.classList.remove('dropb','dropa'));tgd.drop=null;
for(const t of document.querySelectorAll('#hd [data-pid]')){if(t===tgd.tab)continue;const r=t.getBoundingClientRect();if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top-6&&ev.clientY<=r.bottom+6){const af=ev.clientX>r.left+r.width/2;t.classList.add(af?'dropa':'dropb');tgd.drop={id:t.dataset.pid,af};break}}});
const tgEnd=ev=>{if(!tgd)return;const q=tgd;tgd=null;tgClr();if(!q.drop||ev.type==='pointercancel')return;const a=S.pages,i=a.findIndex(p=>p.id===q.id);if(i<0)return;const m=a.splice(i,1)[0],j=a.findIndex(p=>p.id===q.drop.id);if(j<0){a.splice(i,0,m);return}a.splice(q.drop.af?j+1:j,0,m);hist.push(q.snap);if(hist.length>8)hist.shift();commit()};
document.addEventListener('pointerup',tgEnd);document.addEventListener('pointercancel',tgEnd);
function doLogin(){const u=$('#lu'),p=$('#lp'),m=$('.lerr');if(!u||!p)return;if(u.value.trim().toUpperCase()!=='ADMIN'||p.value!=='ADMIN'){if(m)m.textContent='Usuário ou senha incorretos.';p.value='';p.focus();return}
devOn=true;loginOpen=false;try{sessionStorage.setItem('dengue-dev','1')}catch(x){}toast('Modo dev ativado');render()}
try{if(window.claude&&window.claude.use)window.claude.use('artifact').then(a=>{ART=a||null}).catch(()=>{})}catch(x){}
render();
</script>
